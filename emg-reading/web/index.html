<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EMG recorder</title>
<link rel="stylesheet" href="/web/style.css">
</head>
<body>
<div id="warnings"></div>

<main>
  <section id="left">
    <form id="setup">
      <h1>New session</h1>
      <p id="source" class="muted"></p>
      <label>Subject id <input name="subject" required pattern="[A-Za-z0-9_\-]{1,32}"></label>
      <div class="row">
        <label>Band on
          <select name="band_arm"><option value="right">right arm</option><option value="left">left arm</option></select>
        </label>
        <label>Camera tracks
          <select name="tracked_hand"><option value="right">right hand</option><option value="left">left hand</option></select>
        </label>
      </div>
      <label>Placement <input name="placement" placeholder="e.g. logo on top, 3 cm below the elbow crease"></label>
      <fieldset id="postures"><legend>Postures</legend></fieldset>
      <div class="row">
        <label>Repetitions <input name="reps" type="number" min="1" max="20" value="3"></label>
        <label>Hold s <input name="hold_s" type="number" min="1" max="30" step="0.5" value="4"></label>
        <label>Rest s <input name="rest_s" type="number" min="1" max="30" step="0.5" value="3"></label>
        <label>Free movement s <input name="free_s" type="number" min="0" max="600" step="5" value="30"></label>
      </div>
      <label>Notes <input name="notes"></label>
      <p id="duration" class="muted"></p>
      <button type="submit">Start recording</button>
      <p id="setup-error" class="error"></p>
      <div id="summary" hidden></div>
    </form>

    <div id="cue-panel" hidden>
      <div class="cue-top"><span id="posture"></span><span id="progress-text"></span></div>
      <div id="cue-text"></div>
      <div class="bar"><div id="cue-bar"></div></div>
      <div id="cue-time"></div>
      <div id="next"></div>
      <canvas id="target" width="360" height="300"></canvas>
      <div class="controls">
        <button id="btn-main">Pause</button>
        <button id="btn-bad" title="b">Mark bad (b)</button>
        <button id="btn-stop" class="danger">Stop</button>
      </div>
      <p id="session-info" class="muted"></p>
    </div>
  </section>

  <section id="right">
    <div class="view-select">
      <select id="view">
        <option value="camera">Camera</option>
        <option value="pose">Pose match</option>
        <option value="emg">EMG bars</option>
        <option value="model" disabled>Model prediction (no model yet)</option>
      </select>
      <span id="view-note" class="muted"></span>
    </div>
    <div id="view-pose" class="view" hidden>
      <canvas id="pose" width="480" height="400"></canvas>
      <div id="score"></div>
    </div>
    <div id="view-emg" class="view" hidden>
      <canvas id="emg" width="480" height="400"></canvas>
    </div>
    <div id="view-camera" class="view">
      <div class="mirror"><img id="video" alt=""><canvas id="overlay"></canvas></div>
    </div>
  </section>
</main>

<script src="/web/hand.js"></script>
<script src="/web/app.js"></script>
</body>
</html>
